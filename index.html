<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Aangan Astrologer</title>
<style>
  :root{
    --bg:#0C0904; --gold:#D9A94F; --gold-hi:#F5D67F; --ink:#F5EFE2;
    --card:rgba(255,255,255,0.06); --line:rgba(217,169,79,0.4);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
    font-family:system-ui,-apple-system,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .card{
    width:100%; max-width:380px; background:var(--card);
    border:1px solid var(--line); border-radius:18px; padding:28px;
  }
  h1{ color:var(--gold-hi); font-size:22px; text-align:center; margin:0 0 24px; }
  input{
    width:100%; padding:14px; margin-bottom:12px; border-radius:10px;
    border:1px solid var(--line); background:rgba(255,255,255,0.05);
    color:var(--ink); font-size:16px;
  }
  button{
    width:100%; padding:14px; border-radius:10px; border:none;
    background:var(--gold); color:#2E1D0C; font-weight:700; font-size:16px;
    cursor:pointer; margin-bottom:10px;
  }
  button:disabled{ opacity:0.5; }
  #status-msg{ text-align:center; font-size:13px; color:#999; min-height:18px; margin-top:8px; }
  #dashboard{ display:none; text-align:center; }
  #dashboard h2{ color:var(--gold-hi); margin-bottom:6px; }
  .toggle-wrap{ display:flex; align-items:center; justify-content:center; gap:12px; margin:24px 0; }
  .toggle{
    width:60px; height:32px; border-radius:20px; background:#444;
    position:relative; cursor:pointer; transition:background 0.2s;
  }
  .toggle.on{ background:#3E9E5C; }
  .toggle::after{
    content:''; position:absolute; top:3px; left:3px; width:26px; height:26px;
    border-radius:50%; background:#fff; transition:left 0.2s;
  }
  .toggle.on::after{ left:31px; }
  #status-label{ font-weight:600; font-size:15px; }
  #logout{ background:transparent; border:1px solid var(--line); color:var(--gold-hi); margin-top:20px; }
</style>
</head>
<body>

<div class="card" id="login-card">
  <h1>Aangan Astrologer Login</h1>
  <div id="step-phone">
    <input id="phone" type="tel" placeholder="+91 10-digit mobile number">
    <button id="send-otp">Send OTP</button>
  </div>
  <div id="step-otp" style="display:none;">
    <input id="otp" type="text" placeholder="Enter OTP">
    <button id="verify-otp">Verify & Login</button>
  </div>
  <div id="status-msg"></div>
  <div id="recaptcha-container"></div>
</div>

<div class="card" id="dashboard">
  <h2>Welcome, Astrologer</h2>
  <p style="color:#999; font-size:13px;" id="uid-display"></p>
  <div class="toggle-wrap">
    <div class="toggle" id="online-toggle"></div>
    <span id="status-label">Offline</span>
  </div>
  <button id="logout">Logout</button>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getAuth, RecaptchaVerifier, signInWithPhoneNumber, signOut, onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import {
    getFirestore, doc, setDoc, updateDoc, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  // ---- Your Firebase config (from console) ----
  const firebaseConfig = {
    apiKey: "AIzaSyDubjcSirXbe4EJSFggYDveb4gVKUEElR0",
    authDomain: "aangan-ecosystem.firebaseapp.com",
    projectId: "aangan-ecosystem",
    storageBucket: "aangan-ecosystem.firebasestorage.app",
    messagingSenderId: "323610578849",
    appId: "1:323610578849:web:d0b6128870160a786b85e0"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const loginCard = document.getElementById('login-card');
  const dashboard = document.getElementById('dashboard');
  const statusMsg = document.getElementById('status-msg');
  const stepPhone = document.getElementById('step-phone');
  const stepOtp = document.getElementById('step-otp');
  let confirmationResult = null;

  // Invisible reCAPTCHA
  window.recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', { size: 'invisible' });

  document.getElementById('send-otp').addEventListener('click', async () => {
    let phone = document.getElementById('phone').value.trim();
    if (!phone.startsWith('+')) phone = '+91' + phone;
    statusMsg.textContent = 'Sending OTP...';
    try {
      confirmationResult = await signInWithPhoneNumber(auth, phone, window.recaptchaVerifier);
      stepPhone.style.display = 'none';
      stepOtp.style.display = 'block';
      statusMsg.textContent = 'OTP sent. Enter it below.';
    } catch (err) {
      statusMsg.textContent = 'Error: ' + err.message;
    }
  });

  document.getElementById('verify-otp').addEventListener('click', async () => {
    const otp = document.getElementById('otp').value.trim();
    statusMsg.textContent = 'Verifying...';
    try {
      const result = await confirmationResult.confirm(otp);
      const uid = result.user.uid;
      // Create/update astrologer profile doc on first login
      await setDoc(doc(db, 'astrologers', uid), {
        phone: result.user.phoneNumber,
        online: false,
        updatedAt: serverTimestamp()
      }, { merge: true });
      statusMsg.textContent = '';
    } catch (err) {
      statusMsg.textContent = 'Wrong OTP. Try again.';
    }
  });

  onAuthStateChanged(auth, (user) => {
    if (user) {
      loginCard.style.display = 'none';
      dashboard.style.display = 'block';
      document.getElementById('uid-display').textContent = user.phoneNumber;
      window.currentUid = user.uid;
    } else {
      loginCard.style.display = 'block';
      dashboard.style.display = 'none';
    }
  });

  const toggle = document.getElementById('online-toggle');
  const label = document.getElementById('status-label');
  let isOnline = false;

  toggle.addEventListener('click', async () => {
    isOnline = !isOnline;
    toggle.classList.toggle('on', isOnline);
    label.textContent = isOnline ? 'Online' : 'Offline';
    await updateDoc(doc(db, 'astrologers', window.currentUid), {
      online: isOnline,
      updatedAt: serverTimestamp()
    });
  });

  document.getElementById('logout').addEventListener('click', () => signOut(auth));
</script>

</body>
</html>
